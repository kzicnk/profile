<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguyễn Văn Khắc</title>

    <link rel="shortcut icon" href="./img/icon.ico" type="image/x-icon">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #play-button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            background: #ff4d6d;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        #play-button:hover {
            opacity: 0.8;
        }

        h1 {
            font-size: 40px;
        }
    </style>
</head>

<body>

    <div id="overlay">
        <button id="play-button">
            Click để phát nhạc
        </button>
    </div>

    <h1>Nguyễn Văn Khắc</h1>

    <audio id="background-music" loop>
        <source src="./audio/Bông Hoa Chẳng Tồn Tại RIN Music Remix Huy Vạc Em Hãy Quay Về Để Anh Thôi Nhớ Mong Hot TikTok.mp3" type="audio/mpeg">
    </audio>

    <script>
        const button = document.getElementById("play-button");
        const overlay = document.getElementById("overlay");
        const music = document.getElementById("background-music");

        button.addEventListener("click", () => {
            music.play();
            overlay.style.display = "none";
        });
    </script>

</body>

</html>
